# PATH B — Argo Rollouts REAL em cluster local (kind/minikube).
#
# Rollout do checkout-service com estratégia canary + análise automática.
# Fluxo do lab (ver k8s/README.md):
#   1) aplique este manifesto COMO ESTÁ (APP_VERSION=v1, saudável) -> vira stable.
#   2) troque a env para o canary v2 (buggy) e reaplique -> dispara o canary,
#      a AnalysisTemplate reprova e o Argo faz ROLLBACK sozinho.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
      annotations:
        # O Prometheus deste lab descobre os pods por estas annotations.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: checkout
          image: checkout-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # ----- estado inicial: STABLE saudável (v1) -----
            - name: APP_VERSION
              value: "v1"
            - name: ERROR_RATE
              value: "0.0"
            - name: EXTRA_LATENCY_MS
              value: "0"
            # -------------------------------------------------
            - name: FLAGD_OFREP_URL
              value: "http://flagd:8016"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
  strategy:
    canary:
      canaryService: checkout-canary
      stableService: checkout-stable
      # setWeight 10 -> 25 -> 50 -> 100, com pausa e análise em cada gate.
      steps:
        - setWeight: 10
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: checkout-canary-analysis
        - setWeight: 25
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: checkout-canary-analysis
        - setWeight: 50
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: checkout-canary-analysis
        - setWeight: 100
